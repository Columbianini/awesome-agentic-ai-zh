[workspace]
authors = ["Dongni An <da2899@columbia.edu>"]
channels = ["conda-forge"]
name = "awesome-agentic-ai-zh"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
pypdf = ">=6.20.0,<7"
dashscope = ">=1.25.19,<2"
langchain-text-splitters = ">=1.1.3,<2"
langchain-ollama = ">=1.1.0,<2"
numpy = ">=2.5.4,<3"
bm25s = ">=0.3.13,<0.4"
jieba = ">=0.42.1,<0.43"
pymilvus = ">=3.0.2,<4"
milvus-lite = ">=3.2.1,<4"

[feature.base.dependencies]
notebook = ">=7.6.3,<8"
openai = ">=2.53.0,<3"
python-dotenv = ">=1.2.4,<2"
langchain-openai = ">=1.6.7,<2"
langchain-tavily = ">=0.2.18,<0.3"

[feature.base.pypi-dependencies]
openai = "*"
langchain-qwq = ">=0.3.5, <0.4"
pydantic = "*"
langgraph-checkpoint-sqlite = ">=3.1.1, <4"
langgraph-cli = ">=0.4.32, <0.5"
fastapi = ">=0.142.2, <0.143"
alibabacloud-oss-v2 = ">=1.4.0, <2"
uv = ">=0.12.22, <0.13"

[feature.dev.dependencies]

[feature.dev.pypi-dependencies]
langchain = { version = "*", extras = ["mcp"] }
fastmcp = ">=4.0.10, <5"

[feature.default-ext.dependencies]

[feature.default-ext.pypi-dependencies]
langchain = "*"
langchain-mcp-adapters = ">=0.3.2, <0.4"

[environments]
default = ["base", "default-ext"]
dev = { features = ["base", "dev"], no-default-feature = true }

[pypi-dependencies]
fastmcp = ">=3.4.7, <4"
langchain-community = ">=0.4.2, <0.5"
mineru-open-sdk = ">=0.2.5, <0.3"
langchain-mineru = ">=0.1.3, <0.2"
pymilvus = { version = "*", extras = ["milvus-lite"] }
